name: Download PE to Artifact

on:
  workflow_dispatch:

jobs:
  download-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download PE via University Mirror
        run: |
          mkdir -p ./pe_files
          echo "正在通过山东大学镜像站高速抓取微PE..."
          # 使用大学镜像站的官方直链，100% 绕过官网封锁与证书问题
          curl -L -o ./pe_files/WePE_64_V2.3.exe "https://mirrors.sdu.edu.cn/wepe/WePE_64_V2.3.exe"

      - name: Verify File Size
        run: |
          # 验证下载的文件大小是否正常（微PE 2.3 64位正版大小应该在 220MB-230MB 左右）
          ls -lh ./pe_files/

      - name: Upload PE to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: my-purified-pe-tool
          path: ./pe_files/
          retention-days: 1
